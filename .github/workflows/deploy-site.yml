name: Publier NARDO (site web installable)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Télécharger le site depuis le lien fourni
        env:
          NARDO_SITE_ZIP_URL: ${{ vars.NARDO_SITE_ZIP_URL }}
        run: |
          set -x
          test -n "$NARDO_SITE_ZIP_URL" || { echo "Variable NARDO_SITE_ZIP_URL manquante"; exit 1; }
          echo "Lien reçu : $NARDO_SITE_ZIP_URL"
          ID=$(echo "$NARDO_SITE_ZIP_URL" | sed -n 's#.*/d/\([^/?]*\).*#\1#p')
          if [ -z "$ID" ]; then ID=$(echo "$NARDO_SITE_ZIP_URL" | sed -n 's#.*[?&]id=\([^&]*\).*#\1#p'); fi
          echo "Identifiant Drive : $ID"
          if [ -n "$ID" ]; then
            curl -L --fail --retry 3 -o site.zip "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" || true
          fi
          if ! unzip -tq site.zip >/dev/null 2>&1; then
            echo "Téléchargement direct incomplet, essai avec gdown…"
            pip install -q --upgrade gdown
            rm -f site.zip
            gdown "$ID" -O site.zip
          fi
          ls -la site.zip
          file site.zip
          unzip -tq site.zip
          mkdir -p site && unzip -q site.zip -d site
          test -f site/index.html || { echo "index.html introuvable dans le zip"; exit 1; }
          echo "Site prêt : $(du -sh site | cut -f1)"
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
